version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: talent-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: talent_hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talent_hub_dev}
      POSTGRES_DB: talent_hub
    ports:
      - "5432:5432"
    volumes:
      - .docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talent_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: talent-hub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - .docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: talent-hub-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-talent_hub}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-talent_hub_dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - .docker-data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Creates the S3 bucket in MinIO on first startup
  minio-init:
    image: minio/mc:latest
    container_name: talent-hub-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-talent_hub}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-talent_hub_dev}
      S3_BUCKET: ${S3_BUCKET:-talent-hub-files}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
        mc mb --ignore-existing local/$$S3_BUCKET &&
        echo 'MinIO bucket ready'
      "
    restart: on-failure

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talent-hub-app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://talent_hub:talent_hub_dev@postgres:5432/talent_hub?schema=public}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-in-production}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-talent_hub}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-talent_hub_dev}
      S3_BUCKET: ${S3_BUCKET:-talent-hub-files}
      S3_REGION: ${S3_REGION:-us-east-1}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@dream-sports.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Port not exposed externally; nginx handles all ingress

  nginx:
    image: nginx:alpine
    container_name: talent-hub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot-webroot:/var/www/certbot:ro
    depends_on:
      - app
