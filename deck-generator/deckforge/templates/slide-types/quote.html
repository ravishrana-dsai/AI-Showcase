<section class="slide">
  <div class="slide-bg"></div>
  <div class="slide-inner">
    <div class="label">{{deck.client}}</div>

    <div class="slide-center">
      <div class="glass-card" style="max-width: 900px; padding: 56px 72px; text-align: center;">
        <div class="quote-mark">"</div>
        <blockquote class="quote-text">{{slide.quote}}</blockquote>
        <p class="quote-attribution">{{slide.attribution}}</p>
      </div>
    </div>
  </div>
  <div class="slide-footer">
    <span class="footer-client">{{deck.client}}</span>
    <span class="footer-slide-num">{{slide.id}}</span>
  </div>
</section>
