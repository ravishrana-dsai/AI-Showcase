<section class="slide">
  <div class="slide-bg"></div>
  <div class="slide-inner">
    <div class="slide-center">
      <!-- Logo (only rendered if slide.logo === true) -->
      <!-- <img class="logo" src="{{logo_src}}" alt="Client logo" /> -->

      <div class="label">{{deck.client}}</div>
      <h1 class="heading-xl" style="margin-top: 24px;">{{slide.heading}}</h1>
      <p class="subheading">{{slide.subheading}}</p>

      <div class="accent-bar" style="margin: 36px auto 0;"></div>
    </div>
  </div>
  <div class="slide-footer">
    <span class="footer-client">{{deck.client}}</span>
    <span class="footer-slide-num">{{slide.id}}</span>
  </div>
</section>
