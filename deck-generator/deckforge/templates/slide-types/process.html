<section class="slide">
  <div class="slide-bg"></div>
  <div class="slide-inner">
    <div class="label">{{deck.client}}</div>
    <h2 class="heading-lg" style="margin-top: 12px;">{{slide.heading}}</h2>

    <!-- Process flow: one .process-step per item in slide.steps, connected by .process-connector -->
    <div class="process-flow">
      <!-- Repeat this pattern for each step in slide.steps -->
      <div class="process-step">
        <div class="process-num">01</div>
        <div class="process-title">{{step.title}}</div>
        <div class="process-desc">{{step.description}}</div>
      </div>
      <div class="process-connector"></div>
      <!-- Next step... -->
    </div>
  </div>
  <div class="slide-footer">
    <span class="footer-client">{{deck.client}}</span>
    <span class="footer-slide-num">{{slide.id}}</span>
  </div>
</section>
