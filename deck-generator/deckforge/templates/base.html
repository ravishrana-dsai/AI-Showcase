<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{deck.title}}</title>

  <!-- Google Fonts — base + editor font options preloaded -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Roboto+Slab:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ── Brand tokens (injected at generation time) ── */
    :root {
      --brand-primary:   {{brand-primary}};
      --brand-secondary: {{brand-secondary}};
      --brand-accent:    {{brand-accent}};
      --font-heading:    'Playfair Display', Georgia, serif;
      --font-body:       'DM Sans', system-ui, sans-serif;

      --brand-surface:   {{brand-surface}};
      --brand-muted:     #8A9BB0;
      --brand-divider:   rgba(255, 255, 255, 0.12);
      --brand-accent-rgb: {{brand-accent-rgb}};
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: #0a0a0a;
      font-family: var(--font-body);
      color: var(--brand-secondary);
    }

    @media screen {
      html, body { width: 100%; min-height: 100vh; }
    }

    @media print {
      html, body { width: 1280px; margin: 0; padding: 0; }
    }

    /* ── Slide container ── */
    .slide {
      width: 1280px;
      height: 720px;
      background: var(--brand-primary);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      page-break-after: always;
      flex-shrink: 0;
    }

    /* Decorative accent bar at top */
    .slide::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--brand-accent) 0%, rgba(var(--brand-accent-rgb), 0.5) 55%, transparent 100%);
      z-index: 2;
    }

    /* ── Layout helpers ── */
    .slide-inner {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 60px 80px 48px;
    }

    .slide-cols {
      flex: 1;
      display: flex;
      gap: 48px;
    }

    .slide-col {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .slide-col--divider {
      border-left: 1px solid var(--brand-divider);
      padding-left: 48px;
    }

    .slide-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* ── Typography ── */
    .heading-xl {
      font-family: var(--font-heading);
      font-size: 56px;
      font-weight: 700;
      line-height: 1.1;
      color: var(--brand-secondary);
      letter-spacing: -0.5px;
    }

    .heading-lg {
      font-family: var(--font-heading);
      font-size: 40px;
      font-weight: 600;
      line-height: 1.2;
      color: var(--brand-secondary);
    }

    .heading-md {
      font-family: var(--font-heading);
      font-size: 28px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--brand-secondary);
    }

    .subheading {
      font-family: var(--font-body);
      font-size: 20px;
      font-weight: 300;
      color: var(--brand-muted);
      margin-top: 16px;
      line-height: 1.5;
    }

    .label {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--brand-accent);
    }

    .body-text {
      font-family: var(--font-body);
      font-size: 17px;
      font-weight: 400;
      line-height: 1.65;
      color: var(--brand-muted);
    }

    /* ── Accent elements ── */
    .accent-bar {
      width: 64px;
      height: 4px;
      background: linear-gradient(90deg, var(--brand-accent), rgba(var(--brand-accent-rgb), 0.25));
      margin-bottom: 24px;
      border-radius: 2px;
    }

    .accent-number {
      font-family: var(--font-heading);
      font-size: 96px;
      font-weight: 700;
      color: var(--brand-accent);
      opacity: 0.15;
      line-height: 1;
      position: absolute;
      top: 40px;
      right: 80px;
    }

    /* ── Bullet list ── */
    .bullet-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 32px;
    }

    .bullet-list li {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      font-family: var(--font-body);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--brand-secondary);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-left: 3px solid rgba(var(--brand-accent-rgb), 0.7);
      border-radius: 8px;
      padding: 12px 18px;
    }

    .bullet-list li::before {
      display: none;
    }

    /* ── Quote block ── */
    .quote-mark {
      font-family: var(--font-heading);
      font-size: 120px;
      line-height: 0.8;
      color: var(--brand-accent);
      opacity: 0.4;
      margin-bottom: 8px;
    }

    .quote-text {
      font-family: var(--font-heading);
      font-size: 30px;
      font-weight: 400;
      font-style: italic;
      line-height: 1.45;
      color: var(--brand-secondary);
      max-width: 860px;
    }

    .quote-attribution {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      color: var(--brand-accent);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 28px;
    }

    /* ── Logo ── */
    .logo {
      height: 40px;
      width: auto;
      object-fit: contain;
      margin-bottom: 40px;
    }

    /* ── Slide footer ── */
    .slide-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 80px 28px;
    }

    .footer-client {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--brand-muted);
    }

    .footer-slide-num {
      font-family: var(--font-body);
      font-size: 12px;
      color: var(--brand-muted);
    }

    /* ── Image in col ── */
    .col-image {
      width: 100%;
      flex: 1;
      object-fit: cover;
      border-radius: 8px;
    }

    /* ── Surface card (two-col panels) ── */
    .surface {
      background: var(--brand-surface);
      border-radius: 12px;
      padding: 32px;
    }

    /* ── Gradient overlay (Gamma-style ambient glow) ── */
    .slide-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 72% 65% at 96% 4%,  rgba(var(--brand-accent-rgb), 0.24) 0%, transparent 55%),
        radial-gradient(ellipse 55% 45% at 4%  96%, rgba(var(--brand-accent-rgb), 0.15) 0%, transparent 55%),
        radial-gradient(ellipse 42% 58% at 52% 48%, rgba(var(--brand-accent-rgb), 0.06) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    /* All slide-inner and slide-footer sit above the gradient */
    .slide-inner, .slide-footer { position: relative; z-index: 1; }

    /* ── Glass card ── */
    .glass-card {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.30),
        0 1px 0 rgba(255, 255, 255, 0.07) inset;
    }

    /* ── Stats slide ── */
    .stats-grid {
      display: flex;
      gap: 24px;
      flex: 1;
      margin-top: 44px;
      align-items: stretch;
    }

    .stat-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 28px 36px;
      position: relative;
      box-shadow:
        0 4px 24px rgba(var(--brand-accent-rgb), 0.10),
        0 12px 40px rgba(0, 0, 0, 0.20);
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 48px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--brand-accent), transparent);
      border-radius: 2px;
    }

    .stat-value {
      font-family: var(--font-heading);
      font-size: 68px;
      font-weight: 700;
      color: var(--brand-secondary);
      line-height: 1;
      letter-spacing: -2px;
      text-shadow: 0 0 28px rgba(var(--brand-accent-rgb), 0.28);
    }

    .stat-label {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      color: var(--brand-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 14px;
    }

    .stat-delta {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      color: var(--brand-accent);
      margin-top: 8px;
      opacity: 0.85;
    }

    /* ── Process slide ── */
    .process-flow {
      display: flex;
      align-items: flex-start;
      flex: 1;
      margin-top: 56px;
    }

    .process-step {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .process-connector {
      flex: 0 0 40px;
      height: 3px;
      background: linear-gradient(90deg, rgba(var(--brand-accent-rgb), 0.7), rgba(var(--brand-accent-rgb), 0.15));
      margin-top: 20px;
      box-shadow: 0 0 8px rgba(var(--brand-accent-rgb), 0.25);
    }

    .process-num {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--brand-accent);
      color: var(--brand-primary);
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 0 5px rgba(var(--brand-accent-rgb), 0.18),
        0 4px 16px rgba(var(--brand-accent-rgb), 0.30);
    }

    .process-title {
      font-family: var(--font-heading);
      font-size: 17px;
      font-weight: 600;
      color: var(--brand-secondary);
      margin-top: 18px;
      line-height: 1.3;
    }

    .process-desc {
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--brand-muted);
      margin-top: 8px;
      line-height: 1.5;
      max-width: 180px;
    }

    /* ── Comparison slide ── */
    .comparison-table {
      flex: 1;
      margin-top: 28px;
      display: flex;
      flex-direction: column;
    }

    .comparison-header {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1.5fr;
      padding: 0 0 14px;
      border-bottom: 2px solid rgba(var(--brand-accent-rgb), 0.3);
    }

    .comparison-header-cell {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--brand-accent);
      text-align: center;
    }

    .comparison-header-cell--label {
      text-align: left;
      color: var(--brand-muted);
    }

    .comparison-row {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1.5fr;
      padding: 14px 0;
      border-bottom: 1px solid var(--brand-divider);
      align-items: center;
    }

    .comparison-label {
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 400;
      color: var(--brand-secondary);
    }

    .comparison-cell {
      font-family: var(--font-body);
      font-size: 15px;
      text-align: center;
      font-weight: 500;
      color: var(--brand-muted);
    }

    .comparison-cell--win {
      color: var(--brand-accent);
      font-weight: 600;
    }

    .comparison-cell--lose {
      color: var(--brand-muted);
      opacity: 0.45;
    }

    /* ── Print ── */
    @media print {
      .slide {
        page-break-after: always;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>

  <!-- ── Editor styles — stripped on HTML download ── -->
  <style id="df-editor-styles">
    .df-toolbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: #111827;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      z-index: 1000;
      font-family: 'DM Sans', system-ui, sans-serif;
    }

    .df-toolbar__logo {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #00C9A7;
      flex-shrink: 0;
    }

    .df-toolbar__divider {
      width: 1px;
      height: 24px;
      background: rgba(255,255,255,0.1);
      flex-shrink: 0;
    }

    .df-toolbar__title {
      font-size: 14px;
      font-weight: 500;
      color: #e5e7eb;
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .df-toolbar__group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .df-toolbar__group--right { margin-left: auto; }

    .df-toolbar__label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      color: #9ca3af;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      user-select: none;
    }

    .df-toolbar__color {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      cursor: pointer;
      padding: 2px;
      background: none;
    }

    .df-toolbar__color::-webkit-color-swatch-wrapper { padding: 0; }
    .df-toolbar__color::-webkit-color-swatch { border: none; border-radius: 3px; }

    .df-toolbar__select {
      background: #1f2937;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      color: #e5e7eb;
      font-size: 12px;
      font-family: 'DM Sans', system-ui, sans-serif;
      padding: 5px 8px;
      cursor: pointer;
      outline: none;
    }

    .df-toolbar__select:focus { border-color: #00C9A7; }

    .df-toolbar__btn {
      background: #1f2937;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 7px;
      color: #e5e7eb;
      font-size: 12px;
      font-weight: 500;
      font-family: 'DM Sans', system-ui, sans-serif;
      padding: 7px 14px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }

    .df-toolbar__btn:hover { background: #374151; border-color: rgba(255,255,255,0.2); }

    .df-toolbar__btn--primary {
      background: #00C9A7;
      border-color: #00C9A7;
      color: #0D1B2A;
      font-weight: 600;
    }

    .df-toolbar__btn--primary:hover { background: #00b396; border-color: #00b396; }

    .df-layout {
      display: flex;
      margin-top: 52px;
      min-height: calc(100vh - 52px);
    }

    .df-nav {
      width: 220px;
      position: fixed;
      top: 52px; bottom: 0; left: 0;
      overflow-y: auto;
      background: #111827;
      border-right: 1px solid rgba(255,255,255,0.06);
      padding: 16px 0;
      z-index: 999;
    }

    .df-nav::-webkit-scrollbar { width: 4px; }
    .df-nav::-webkit-scrollbar-track { background: transparent; }
    .df-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .df-nav__label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #374151;
      padding: 4px 16px 12px;
      font-family: 'DM Sans', system-ui, sans-serif;
    }

    .df-nav__item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 16px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }

    .df-nav__item:hover { background: rgba(255,255,255,0.04); }

    .df-nav__item--active {
      border-left-color: #00C9A7;
      background: rgba(0,201,167,0.06);
    }

    .df-nav__num {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      background: #1f2937;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      color: #6b7280;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
      font-family: 'DM Sans', system-ui, sans-serif;
    }

    .df-nav__item--active .df-nav__num { background: rgba(0,201,167,0.15); color: #00C9A7; }

    .df-nav__heading {
      font-size: 12px;
      font-weight: 400;
      color: #6b7280;
      line-height: 1.4;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      font-family: 'DM Sans', system-ui, sans-serif;
    }

    .df-nav__item--active .df-nav__heading { color: #d1d5db; }

    .df-canvas {
      margin-left: 220px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 0 80px;
      gap: 40px;
      background: #0a0a0a;
      min-height: 100vh;
    }

    .df-editable:hover {
      outline: 2px solid rgba(0,201,167,0.35);
      outline-offset: 3px;
      border-radius: 3px;
      cursor: text;
    }

    .df-editable:focus {
      outline: 2px solid rgba(0,201,167,0.65);
      outline-offset: 3px;
      border-radius: 3px;
    }

    .df-hint {
      position: fixed;
      bottom: 24px; right: 24px;
      background: #1f2937;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 12px;
      color: #9ca3af;
      font-family: 'DM Sans', system-ui, sans-serif;
      z-index: 998;
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.3s, transform 0.3s;
    }

    .df-hint--visible { opacity: 1; transform: translateY(0); }

    @media print {
      .df-toolbar, .df-nav, .df-hint, #df-editor-styles { display: none !important; }
      .df-layout { margin-top: 0; }
      .df-canvas { margin-left: 0; padding: 0; gap: 0; background: none; }
      [contenteditable] { outline: none !important; }
    }
  </style>
</head>
<body>

  <!-- ── Editor toolbar ── -->
  <div class="df-toolbar" id="df-toolbar">
    <span class="df-toolbar__logo">DeckForge</span>
    <div class="df-toolbar__divider"></div>
    <span class="df-toolbar__title" id="df-deck-title">{{deck.title}}</span>
    <div class="df-toolbar__divider"></div>

    <div class="df-toolbar__group">
      <label class="df-toolbar__label" title="Slide background color">
        BG
        <input type="color" id="df-color-primary" class="df-toolbar__color" value="#0D1B2A" />
      </label>
      <label class="df-toolbar__label" title="Accent color">
        Accent
        <input type="color" id="df-color-accent" class="df-toolbar__color" value="#00C9A7" />
      </label>
    </div>

    <div class="df-toolbar__divider"></div>

    <div class="df-toolbar__group">
      <label class="df-toolbar__label">
        Heading font
        <select id="df-font-select" class="df-toolbar__select">
          <option value="'Playfair Display', Georgia, serif">Playfair Display</option>
          <option value="'Inter', system-ui, sans-serif">Inter</option>
          <option value="'Lora', Georgia, serif">Lora</option>
          <option value="'Roboto Slab', serif">Roboto Slab</option>
        </select>
      </label>
    </div>

    <div class="df-toolbar__group df-toolbar__group--right">
      <button class="df-toolbar__btn" id="df-btn-download">Download HTML</button>
      <button class="df-toolbar__btn df-toolbar__btn--primary" id="df-btn-export">Export PDF</button>
    </div>
  </div>

  <!-- ── Editor layout ── -->
  <div class="df-layout" id="df-layout">
    <nav class="df-nav" id="df-nav">
      <div class="df-nav__label">Slides</div>
    </nav>
    <main class="df-canvas" id="df-canvas">
      {{slides}}
    </main>
  </div>

  <!-- ── Edit hint toast ── -->
  <div class="df-hint" id="df-hint">Click any text to edit</div>

  <!-- ── Editor script — stripped on HTML download ── -->
  <script id="df-editor-script">
  (function () {
    'use strict';

    var STORAGE_KEY = 'deckforge:' + document.title;

    var EDITABLE_SEL = [
      '.slide .heading-xl',
      '.slide .heading-lg',
      '.slide .heading-md',
      '.slide .subheading',
      '.slide .body-text',
      '.slide .label',
      '.slide .quote-text',
      '.slide .quote-attribution',
      '.slide .bullet-list li',
      '.slide .footer-client',
    ].join(', ');

    function debounce(fn, ms) {
      var t;
      return function () {
        var args = arguments;
        clearTimeout(t);
        t = setTimeout(function () { fn.apply(null, args); }, ms);
      };
    }

    /* Restore saved state before any other init */
    function restoreFromStorage() {
      try {
        var saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return;
        var state = JSON.parse(saved);
        var slides = document.querySelectorAll('.slide');
        if (state.slides && state.slides.length === slides.length) {
          slides.forEach(function (slide, i) {
            if (state.slides[i]) slide.innerHTML = state.slides[i];
          });
        }
        if (state.brandPrimary) {
          document.documentElement.style.setProperty('--brand-primary', state.brandPrimary);
          var p = document.getElementById('df-color-primary');
          if (p) p.value = state.brandPrimary;
        }
        if (state.brandAccent) {
          document.documentElement.style.setProperty('--brand-accent', state.brandAccent);
          var a = document.getElementById('df-color-accent');
          if (a) a.value = state.brandAccent;
        }
        if (state.fontHeading) {
          document.documentElement.style.setProperty('--font-heading', state.fontHeading);
          var s = document.getElementById('df-font-select');
          if (s) s.value = state.fontHeading;
        }
      } catch (e) {
        console.warn('DeckForge: could not restore saved state.', e);
      }
    }

    /* Make text leaf nodes editable */
    function makeEditable() {
      document.querySelectorAll(EDITABLE_SEL).forEach(function (el) {
        el.setAttribute('contenteditable', 'true');
        el.setAttribute('spellcheck', 'false');
        el.classList.add('df-editable');
      });
    }

    /* Build left slide navigator */
    function buildNav() {
      var nav = document.getElementById('df-nav');
      document.querySelectorAll('.slide').forEach(function (slide, i) {
        var heading = slide.querySelector('.heading-xl, .heading-lg, .heading-md');
        var text = heading ? heading.textContent.trim() : 'Slide ' + (i + 1);
        var item = document.createElement('div');
        item.className = 'df-nav__item';
        item.dataset.slideIndex = i;
        item.innerHTML =
          '<span class="df-nav__num">' + (i + 1) + '</span>' +
          '<span class="df-nav__heading">' + escapeHTML(text) + '</span>';
        item.addEventListener('click', function () {
          slide.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
        nav.appendChild(item);
      });
    }

    /* IntersectionObserver: highlight active slide in nav */
    function observeSlides() {
      var slides = Array.from(document.querySelectorAll('.slide'));
      var navItems = document.querySelectorAll('.df-nav__item');
      var ratioMap = {};

      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          ratioMap[slides.indexOf(entry.target)] = entry.intersectionRatio;
        });
        var bestIdx = -1, bestRatio = 0;
        Object.keys(ratioMap).forEach(function (idx) {
          if (ratioMap[idx] > bestRatio) { bestRatio = ratioMap[idx]; bestIdx = +idx; }
        });
        navItems.forEach(function (item, i) {
          item.classList.toggle('df-nav__item--active', i === bestIdx);
        });
      }, { threshold: [0, 0.25, 0.5, 0.75, 1.0] });

      slides.forEach(function (s) { observer.observe(s); });
    }

    /* Live color pickers */
    function bindColorPickers() {
      function cssVar(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }
      var primaryEl = document.getElementById('df-color-primary');
      var accentEl  = document.getElementById('df-color-accent');
      if (primaryEl) {
        var ph = rgbToHex(cssVar('--brand-primary'));
        if (ph) primaryEl.value = ph;
        primaryEl.addEventListener('input', function (e) {
          document.documentElement.style.setProperty('--brand-primary', e.target.value);
          saveState();
        });
      }
      if (accentEl) {
        var ah = rgbToHex(cssVar('--brand-accent'));
        if (ah) accentEl.value = ah;
        accentEl.addEventListener('input', function (e) {
          document.documentElement.style.setProperty('--brand-accent', e.target.value);
          saveState();
        });
      }
    }

    /* Font selector */
    function bindFontSelector() {
      var sel = document.getElementById('df-font-select');
      if (!sel) return;
      sel.addEventListener('change', function (e) {
        document.documentElement.style.setProperty('--font-heading', e.target.value);
        saveState();
      });
    }

    /* Debounced auto-save to localStorage */
    var saveState = debounce(function () {
      try {
        var slides = document.querySelectorAll('.slide');
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          slides: Array.from(slides).map(function (s) { return s.innerHTML; }),
          brandPrimary: getComputedStyle(document.documentElement).getPropertyValue('--brand-primary').trim(),
          brandAccent:  getComputedStyle(document.documentElement).getPropertyValue('--brand-accent').trim(),
          fontHeading:  getComputedStyle(document.documentElement).getPropertyValue('--font-heading').trim(),
          timestamp: new Date().toISOString(),
        }));
      } catch (e) {
        console.warn('DeckForge: auto-save failed.', e);
      }
    }, 400);

    function bindAutoSave() {
      var canvas = document.getElementById('df-canvas');
      if (canvas) canvas.addEventListener('input', saveState);
    }

    /* Download clean HTML */
    function bindDownload() {
      var btn = document.getElementById('df-btn-download');
      if (btn) btn.addEventListener('click', downloadHTML);
    }

    function downloadHTML() {
      var clone = document.cloneNode(true);

      /* Bake CSS variable overrides into :root */
      var primary     = document.documentElement.style.getPropertyValue('--brand-primary')
                        || getComputedStyle(document.documentElement).getPropertyValue('--brand-primary').trim();
      var accent      = document.documentElement.style.getPropertyValue('--brand-accent')
                        || getComputedStyle(document.documentElement).getPropertyValue('--brand-accent').trim();
      var fontHeading = document.documentElement.style.getPropertyValue('--font-heading')
                        || getComputedStyle(document.documentElement).getPropertyValue('--font-heading').trim();

      var slideStyle = clone.querySelector('style:not(#df-editor-styles)');
      if (slideStyle) {
        slideStyle.textContent = slideStyle.textContent
          .replace(/(--brand-primary:\s*)([^;]+)(;)/, '$1' + primary + '$3')
          .replace(/(--brand-accent:\s*)([^;]+)(;)/,  '$1' + accent + '$3')
          .replace(/(--font-heading:\s*)([^;]+)(;)/,   '$1' + fontHeading + '$3')
          .replace(/@media screen\s*\{[^}]*\}/g, '')
          .replace(
            /html,\s*body\s*\{\s*background:\s*#0a0a0a;[^}]*\}/,
            'html, body { width: 1280px; min-height: 720px; background: var(--brand-primary); font-family: var(--font-body); color: var(--brand-secondary); }'
          );
      }

      /* Remove editor chrome */
      ['#df-toolbar', '#df-nav', '#df-editor-styles', '#df-editor-script', '#df-hint'].forEach(function (sel) {
        var el = clone.querySelector(sel);
        if (el) el.remove();
      });

      /* Unwrap layout wrapper: move slides directly into body */
      var canvas = clone.querySelector('#df-canvas');
      var layout = clone.querySelector('#df-layout');
      if (canvas && layout) {
        var body = clone.querySelector('body');
        canvas.querySelectorAll('.slide').forEach(function (s) { body.appendChild(s); });
        layout.remove();
      }

      /* Strip contenteditable and editor classes */
      clone.querySelectorAll('[contenteditable]').forEach(function (el) {
        el.removeAttribute('contenteditable');
        el.removeAttribute('spellcheck');
        el.classList.remove('df-editable');
      });

      /* Remove inline CSS var overrides on <html> */
      clone.documentElement.removeAttribute('style');

      var html = '<!DOCTYPE html>\n' + clone.documentElement.outerHTML;
      var blob = new Blob([html], { type: 'text/html' });
      var url  = URL.createObjectURL(blob);
      var a    = document.createElement('a');
      a.href = url; a.download = 'deck.html'; a.click();
      URL.revokeObjectURL(url);
    }

    /* Export PDF via browser print */
    function bindExportPDF() {
      var btn = document.getElementById('df-btn-export');
      if (btn) btn.addEventListener('click', function () { window.print(); });
    }

    /* First-visit hint toast */
    function showHint() {
      var hint = document.getElementById('df-hint');
      if (!hint || sessionStorage.getItem('df-hint-shown')) return;
      hint.classList.add('df-hint--visible');
      setTimeout(function () { hint.classList.remove('df-hint--visible'); }, 3500);
      sessionStorage.setItem('df-hint-shown', '1');
    }

    /* Utilities */
    function escapeHTML(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function rgbToHex(str) {
      if (!str) return null;
      str = str.trim();
      if (str.startsWith('#')) return str.length === 7 ? str : null;
      var m = str.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
      if (!m) return null;
      return '#' + [m[1], m[2], m[3]]
        .map(function (n) { return parseInt(n, 10).toString(16).padStart(2, '0'); })
        .join('');
    }

    /* Boot */
    document.addEventListener('DOMContentLoaded', function () {
      restoreFromStorage();
      makeEditable();
      buildNav();
      observeSlides();
      bindColorPickers();
      bindFontSelector();
      bindAutoSave();
      bindDownload();
      bindExportPDF();
      showHint();
    });

  }());
  </script>
</body>
</html>
